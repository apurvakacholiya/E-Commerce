spec:
  containers:
    - name: airflow-all-in-one
      image: rlohpuq-wx23048.registry.snowflakecomputing.com/ecommerce_orchestration/airflow/airflow_repo/airflow_image:latest
      env:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      command:
        - "airflow"
        - "standalone"
      volumeMounts:
        - name: dags-volume
          mountPath: /opt/airflow/dags
  endpoints:
    - name: airflow-ui
      port: 8080
      public: true
  volumes:
    - name: dags-volume
      source: "@ECOMMERCE_ORCHESTRATION.AIRFLOW.AIRFLOW_DAGS_STAGE"

  # # NEW: Give the container permission to use the internet rule
